[package]
name = "mir2-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mir2-app"
path = "src/main.rs"

[dependencies]
sdl3.workspace = true
# 直接引用 SDL3 的 FFI 层：`sdl3::render::BlendMode` 没暴露
# `SDL_BLENDMODE_BLEND_PREMULTIPLIED`（官方"Alpha 物件"要的 SCREEN 混合），
# 只能从底层常量取。版本与 sdl3 的传递依赖一致，不额外下载。
sdl3-sys = "0.7"
mir2-core = { path = "../core" }
# B（app 连上 server）：协议类型 + 后台会话（消息泵）。两者都**不含 SDL**（D-18）。
mir2-protocol = { path = "../protocol" }
mir2-net = { path = "../net" }
