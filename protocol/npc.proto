// MIR2 协议 · 0x0Axx NPC 对话与商店
//
// 原版把 NPC 对话拆成三条：CM_CLICKNPC(1010) + CM_MERCHANTDLGSELECT(1011) +
// SM_MERCHANTDLG(**服务端把"文本 + 编号选项"拼成一整块**塞在 body 里发出去，
// 见 `M2Server/npcdlg.go` 现在走的那条 legacy 路)，商店则是一堆 `SM_*` 号。
//
// 本版把它拆成**结构化**的样子：说一段话 + 一组可点选项，客户端回一个下标。
// 好处是客户端不用解析中文文本里的 `[1] xxx` 编号，也不必猜哪几行是选项。
//
// ⚠️ 与 `npcdlg.go` 的映射：脚本里一段（`[@标签]`）的 `Say` 是 `NpcSay.text`，
// `Links`（`<文字/@标签>`）逐条变成 `NpcOption`，`index` 从 **1** 起（与原版
// "Recog = 选项序号" 那套一致，`ClMain.pas:3661-3681`）。
syntax = "proto3";

package mir2;

option go_package = "github.com/algotao/mir2/server/protocol;protocol";

// 客户端 → 服务端：点了一个 NPC（原版 `CM_CLICKNPC`，Recog = NPC 的 ActorId）。
message NpcClick {
  uint64 npc_id = 1;
}

// 一个可点选项（对应脚本里的 `<文字/@标签>`）。
message NpcOption {
  // 1-based 序号（客户端原样回传，服务端按下标找 `Links`）。
  uint32 index = 1;
  string text = 2;
}

// 服务端 → 客户端：NPC 说一段话 + 可点选项。
message NpcSay {
  uint64 npc_id = 1;
  // 正文（可能多行；脚本里的续行符已去掉）。
  string text = 2;
  repeated NpcOption options = 3;
}

// 客户端 → 服务端：选了第 index 项（1-based）。
message NpcSelect {
  uint64 npc_id = 1;
  uint32 index = 2;
}

// 客户端 → 服务端：关掉对话（原版 `@exit`；服务端清 `p.dialog`）。
message NpcClose {
  uint64 npc_id = 1;
}

// ---------- 商店（原版 `SM_SENDGOODSLIST` / `CM_BUYITEM` / `CM_SELLITEM`）----------
//
// 原版那条是**文本协议**：把"名称/子菜单/价格/存量/"拼成一整串塞在 body 里
//（`ObjNpc.pas:1449-1455` 写、`ClMain.pas:6158-6190` 用 `'/'` 切四次读出来），
// 买入时再把"名字 + 存量"当 `Param/Tag` 回发（`FState.pas:5244`）。
// 我们照例拆成结构化消息：**服务端不依赖客户端回发的存量**（买入按名字解析，
// 见 `shop.go` 的 `shopGoodsByName`）。
message ShopItem {
  string name = 1;
  uint64 price = 2;
  // 货架存量：我们的商品按模板即时生成、永不缺货 ⇒ 这一栏只用于**显示**（见 `shop.go`
  // 的 `shopStock`）。
  uint32 stock = 3;
  // 要不要弹"买几个"的二级菜单（原版 `submenu`：可堆叠类为 0，其余为 1）。
  bool submenu = 4;
  // 最大持久（原版商品列表第三栏"持久"显示的就是它，`FState.pas` 的买窗）。
  uint32 dura_max = 5;
}

// 服务端 → 客户端：这个商人的商品列表（原版 `SM_SENDGOODSLIST`）。
message ShopList {
  uint64 npc_id = 1;
  repeated ShopItem items = 2;
  // **开的是哪个窗**：1 = 买（商品列表），2 = 卖（放物品的槽）。
  //
  // ⚠️ 为什么要有：原版点 NPC 脚本里的 `<我要买/@buy>` 与 `<我要卖/@sell>` 弹的是
  // **两个不同的窗**（列表窗 / 卖出窗），数据都是同一次 `SM_SENDGOODSLIST` 来的。
  // 我们少了这一位 ⇒ 点"卖"时只能要么两个窗一起弹、要么都不弹
  //（用户 2026-10-10："卖售窗口没有出现"）。
  uint32 mode = 3;
}

// 客户端 → 服务端：买 `count` 个 `name`（原版 `CM_BUYITEM` 的 `Param=存量 / Tag=名字`）。
message ShopBuy {
  uint64 npc_id = 1;
  string name = 2;
  uint32 count = 3;
}

// 客户端 → 服务端：卖背包里 `make_index` 那一个（原版 `CM_SELLITEM` 用 MakeIndex 认物）。
message ShopSell {
  uint64 npc_id = 1;
  // 物品实例号（`UserItem.make_index`）；`count > 1` 时按可堆叠数量卖。
  int32 make_index = 2;
  uint32 count = 3;
}

// 服务端 → 客户端：买卖的结果（原版是 `SM_BUYITEM_SUCCESS` / `SM_SOLD_FAIL` 那几个号
// + 随后的金币/背包刷新）。
//
// ⚠️ 成功后的**背包与金币**由 `BagItems` / `AbilityUpdate` 照常下发，不挤在这里。
message ShopResult {
  uint64 npc_id = 1;
  bool ok = 2;
  // 失败原因（金币不够 / 负重超了 / 没有这件…），人能读。
  string message = 3;
}
