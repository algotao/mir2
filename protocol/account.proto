// MIR2 协议 · 0x02xx 账号 / 0x03xx 角色
//
// 对应 docs/protocol.md §5：登录 → 列角色 → 选角（★ 服务端在此申请**角色租约**）。
// ⚠️ 租约被占（同角色在线）⇒ **明确拒绝**，不要"顶号"式静默踢人（D-13）。
// ⚠️ `accountsvc` 不对客户端 Listen；这些消息由 `gamesvr` 作为唯一对端处理（D-13）。
syntax = "proto3";

package mir2;

import "common.proto";

option go_package = "github.com/algotao/mir2/server/protocol;protocol";

// ---------- 0x02xx 账号 ----------

// 客户端 → 服务端：取登录要用的 KDF 参数。
//
// ⚠️ 这条往返是 **D-24①（挑战应答）** 的必需品：存储侧是 `PBKDF2(口令, 服务端随机盐)`，
// 客户端**拿不到盐就算不出服务端能校验的那个值**（这正是 D-24 卡住的地方）。
// 盐不是秘密 —— 标准做法（SCRAM/HTTP digest）都是明文下发它。
message LoginSaltRequest {
  string account = 1;
}

// 服务端 → 客户端：KDF 参数。
//
// ⚠️ 三个数必须与**存储侧**当前用的完全一致（`storage/password.go` 的 pwIterations 等），
// 否则客户端算出来的 `K` 与服务端存的对不上。所以由服务端下发，客户端**不许写死**
// —— 将来调迭代次数时，只有服务端要改。
message LoginSalt {
  bytes salt = 1;
  uint32 iterations = 2;
  uint32 key_len = 3;
}

message Login {
  string account = 1;
  // 口令的**证明**，不是口令、也不是口令的等价物：
  //
  //    password_hash = hex( HMAC-SHA256( K, nonce ‖ account ) )
  //    K            = PBKDF2-SHA256(口令, salt, iterations, key_len)   ← 三个参数由 LoginSalt 下发
  //    nonce        = 握手时 ServerHello.session_key（每条连接一次性的随机值）
  //
  // ⚠️ 三个「不落网络」：明文不落、`K`（等价口令）不落、连证明本身也**绑在这条连接的
  // 一次性 nonce 上** —— 嗅到也重放不了（D-24①）。
  // 字段名保持 `password_hash` 是历史包袱（IDL 先写的），语义以这里为准。
  string password_hash = 2;
  string client_build = 3;
}

enum LoginCode {
  LOGIN_CODE_UNSPECIFIED = 0;
  LOGIN_OK = 1;
  LOGIN_BAD_CREDENTIALS = 2;
  LOGIN_ACCOUNT_NOT_FOUND = 3;   // ⚠️ 与 BAD_CREDENTIALS 同义：**不区分**账号是否存在
  LOGIN_LOCKED = 6;               // 口令错误次数过多，暂时锁定
  LOGIN_ALREADY_ONLINE = 4;
  LOGIN_SERVER_FULL = 5;
}

message LoginResult {
  LoginCode code = 1;
  string message = 2;
  bytes session_token = 3;   // ★ 独立于 TCP 连接（protocol.md §5）
}

message ChangePassword {
  string account = 1;
  string old_password_hash = 2;
  string new_password_hash = 3;
}

message ChangePasswordResult {
  ActionResult result = 1;
}

// 客户端 → 服务端：**创建账号**（D-32）。
//
// 用法（**必须**先走一次 D-24① 的取盐）：
//
//    ① LoginSaltRequest{account} → LoginSalt{salt, iterations, key_len}
//    ② K = PBKDF2-SHA256(口令, salt, iterations, key_len)
//    ③ CreateAccount{account, verifier: hex(K)}
//
// ⚠️ **这里必须把 `K` 本身送过去** —— 建号时服务端手里什么都没有，它得拿到一个
// "以后能用来验登录"的值才能落库（登录侧是拿存着的 K 重算 HMAC 证明来比对）。
// 因此**建号那一次**的 verifier 就是口令的等价物：D-24 说的"等价物不落网络"只对
// **登录**成立；建号这条链的机密性是连接级的（明文仍不落网络）。
//
// ⚠️ 盐由**服务端**在上一步给出并留存（`protoSession.pendingSalt`），客户端不许自带 ——
// 否则盐就成了客户端可控的东西，而盐的意义正是"服务端随机"。
message CreateAccount {
  string account = 1;
  // hex( K )，K = PBKDF2-SHA256(口令, salt, iterations, key_len)
  string verifier = 2;
}

// 服务端 → 客户端：建号结果。
//
// `result.code`：
//
//    0 = 成功
//    1 = 账号已存在（原版 `SM_NEWID_FAIL` 的 nErrCode=0）
//    2 = 账号名不合规（3..14 位，仅 [a-z0-9_]）
//    3 = 本服未开放注册（`-allow-new-account` 关着）
//    4 = 操作过快（同一 IP 5 秒一次，原版是每连接 5 秒）
//    5 = 服务器暂时建不了（存储错误）
//    6 = 没先取盐（缺 KDF 盐 ⇒ 无法落库）
//
// ⚠️ **没有"口令不合规"这一码**：服务端只收到 `verifier`，从来见不到口令 ⇒
// 口令长度/强度只能由客户端把关（原版服务端同样不查口令 ——
// `LMain.pas:1019-1079` 的 `AccountCreate` 只查账号名与重名）。这是挑战应答
// 必然的代价，写在这里免得以后有人来找"服务端怎么不校验口令"。
//
// ⚠️ 成功了也**不自动登录**（原版 `SM_NEWID_SUCCESS` 只是弹个提示，
// 见 `ClMain.pas:3684-3691`）—— 客户端要把人送回登录框自己登。
message CreateAccountResult {
  ActionResult result = 1;
}

// ---------- 0x03xx 角色 ----------

// 角色摘要（选角列表用；不含完整存档）。
message CharacterSummary {
  uint64 character_id = 1;
  string name = 2;
  CharClass class = 3;
  Gender gender = 4;
  uint32 level = 5;
  uint32 gender_hair = 6; // 发型外观
  // **选角槽位**（0 起，固定）：删掉一个角色后，其余角色**留在原来的槽位**，
  // 那个位置空着（用户 2026-10-10 第 1 条：删了角色1，角色2 不该左移）。
  // 服务端按"含已删除的创建次序"编号（`ListByAccountWithSlots`）。
  uint32 slot = 7;
}

message ListCharacters {}

message CharacterList {
  repeated CharacterSummary characters = 1;
}

message SelectCharacter {
  uint64 character_id = 1;
}

enum SelectCharCode {
  SELECT_CHAR_CODE_UNSPECIFIED = 0;
  SELECT_CHAR_OK = 1;
  SELECT_CHAR_NOT_FOUND = 2;
  SELECT_CHAR_LEASE_HELD = 3;  // ★ 该角色已被占用（租约）——明确拒绝，不顶号
  SELECT_CHAR_SERVER_BUSY = 4;
}

message SelectCharacterResult {
  SelectCharCode code = 1;
  string message = 2;
  uint64 character_id = 3;
}

message CreateCharacter {
  string name = 1;
  CharClass class = 2;
  Gender gender = 3;
  uint32 hair = 4;
}

message CreateCharacterResult {
  ActionResult result = 1;
  uint64 character_id = 2; // 成功时返回新角色 id
}

message DeleteCharacter {
  uint64 character_id = 1;
  string password_hash = 2; // 二次确认
}

message DeleteCharacterResult {
  ActionResult result = 1;
}
