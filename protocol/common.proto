// MIR2 协议 · 共享类型
//
// ⚠️ 硬规则（见 docs/protocol.md §4.1）
//  1. 字段号**全局唯一、永不复用**；避开 protobuf 保留区 19000–19999。
//  2. **禁止手写编解码**：两端都由本 schema 生成。
//  3. `oneof` 字段列表**只能**在 envelope.proto（无法跨文件扩展）。
//
// 说明：docs/protocol.md §3 的文件清单未列 common.proto；
//   共享类型（坐标/方向/实体外观）单独成文件，避免各处重复定义。
syntax = "proto3";

package mir2;

option go_package = "github.com/algotao/mir2/server/protocol;protocol";

// 服务端权威的 2D 坐标（格）。
// ⚠️ 视野格数锁死（D-07）：分辨率可变，"看得到多少格"不可变。
message Vec2 {
  int32 x = 1;
  int32 y = 2;
}

// 8 方向。值 = **原版编号 + 1**（原版 0..7，见 GameOfMir `Common/Grobal2.pas:19-26`，
// 服务端侧对应 `entity.DirUp..DirUpLeft`）：
//
//    原版 0=上 1=右上 2=右 3=右下 4=下 5=左下 6=左 7=左上
//
// ⚠️ 曾经写反过：枚举按"下→逆时针"排（DIR_DOWN=1 …），注释却声称"沿用原版顺序"。
// 那种错**不会报错**，只会让每个实体的朝向差 4 个方向（上看起来是下）——
// 正是 §9 要防的"两端都以为自己对"。改这里 = 改线上的枚举值 ⇒ 必须 bump version.txt。
// 0 保留给"未指定"（原版 0 是"上"，所以这里**不能**直接照抄原版编号）。
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIR_UP = 1;         // 原版 0
  DIR_UP_RIGHT = 2;   // 原版 1
  DIR_RIGHT = 3;      // 原版 2
  DIR_DOWN_RIGHT = 4; // 原版 3
  DIR_DOWN = 5;       // 原版 4
  DIR_DOWN_LEFT = 6;  // 原版 5
  DIR_LEFT = 7;       // 原版 6
  DIR_UP_LEFT = 8;    // 原版 7
}

// 三职业（1.76 只有这三个）。
enum CharClass {
  CHAR_CLASS_UNSPECIFIED = 0;
  CHAR_CLASS_WARRIOR = 1; // 战士
  CHAR_CLASS_WIZARD = 2;  // 法师
  CHAR_CLASS_TAOIST = 3;  // 道士
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

// 通用「成功 / 失败」回执。用于一次性事务（丢弃、穿戴、购买…）。
// 原版把结果拆成 *_OK / *_FAIL 两条消息；自研协议合并为一条 + 一个 code。
message ActionResult {
  bool ok = 1;
  uint32 code = 2;   // 0 = 成功；非 0 见各消息的注释
  string message = 3;
}

// 实体外观（原版的 Feature 位打包：raceImg/weapon/hair/dress）。
// 用显式字段而不是位掩码 —— 位掩码是原版 bug 的来源之一。
message EntityFeature {
  uint32 race_img = 1;
  uint32 weapon = 2;
  uint32 hair = 3;
  uint32 dress = 4;
  uint32 effect = 5;
  // 怪物外观号（原版 `Monster.Appr` / `ObjBase.pas` 的 `m_wAppr`）——**只有怪物**用它，
  // 玩家恒 0。
  //
  // ⚠️ 为什么它得单列一个字段：原版把 `MakeHumanFeature`/`MakeMonsterFeature` 的四个字节
  // **打包**进一个 int32（`Grobal2.pas:2663-2699`），于是怪物的 Appr 那 16 位被拆散在
  // `hair`（低字节）与 `dress`（高字节）里。让客户端去拼 `hair | dress<<8` 正是 §10
  // 说的"位掩码是原版 bug 的来源"；所以在协议里给它自己的字段，客户端按 `kind` 取用，
  // 完全不必知道打包布局（服务端在 `featureOf` 那一个函数里拆一次就够）。
  uint32 appr = 6;
}

// 能力值（原版 SM_ABILITY / TAbility）。
// 放在 common 而非 scene：scene（AbilityUpdate）与 combat（LevelUp）都要用。
message Ability {
  uint32 dc_min = 1;
  uint32 dc_max = 2;
  uint32 mc_min = 3;
  uint32 mc_max = 4;
  uint32 sc_min = 5;
  uint32 sc_max = 6;
  uint32 ac = 7;
  uint32 mac = 8;
  uint32 hp = 9;
  uint32 mp = 10;
  uint32 max_hp = 11;
  uint32 max_mp = 12;
  uint32 weight = 13;
  uint32 max_weight = 14;
  uint32 wear_weight = 15;
  uint32 max_wear_weight = 16;
  uint32 level = 17;
  uint64 gold = 18;
  // 经验：`exp` 是**级内经验**（升级时会减去 MaxExp，与原版 `m_Abil.Exp` 同义），
  // `max_exp` 是当前等级升下一级所需的量（`+1` 级的 `LevelNeed(level)`）。
  //
  // ⚠️ 加这两个字段的原因：HUD 的经验条是 `100 * exp / max_exp`（`FState.pas:2885`），
  // 而新协议的 `Ability` 一直没带它们 ⇒ 经验条**画不出来**（`app/src/hud.rs` 如实留空）。
  // 老客户端不读这两个字段 ⇒ 兼容变更，不用 bump `version.txt`。
  uint32 exp = 19;
  uint32 max_exp = 20;
}
