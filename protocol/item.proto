// MIR2 协议 · 0x08xx 物品
//
// 覆盖：背包 / 装备 / 地面物品 / 使用 / 丢弃 / 拾取 / 修理 / 重量 / 金币。
// ⚠️ 原版地面物品用 `SM_ITEMSHOW`(610)、进背包用 `SM_ADDITEM`(200)（见 docs/messages.md §2.5）；
//   自研协议用 `GroundItemShow` / `AddItem` 明确区分，**不要**沿用原版那种混用。
syntax = "proto3";

package mir2;

import "common.proto";

option go_package = "github.com/algotao/mir2/server/protocol;protocol";

// 物品实例（原版 TClientItem）。
message ItemStack {
  uint32 index = 1;       // 物品表索引；0 = 空槽
  string name = 2;
  uint32 looks = 3;       // 外观
  uint32 count = 4;       // 叠加数
  uint32 dura = 5;
  uint32 dura_max = 6;
  uint64 attribute_flags = 7;
  repeated uint32 values = 8; // 属性值（DC/MC/SC/AC/MAC 的 min/max 等，顺序另行约定）
  // **卖价**（原版卖东西 = 原价一半，`handleSellItem`）：客户端"卖:"后面
  // 显示的就是它 —— 拖进卖货圈、点 OK 之前就要看到能卖多少钱。
  uint32 sell_price = 11;
  // 物品**实例号**（`UserItem.MakeIndex`，全服唯一；0 = 空槽）。
  //
  // ⚠️ 为什么必须有：原版认一件东西靠的就是它 —— `CM_USERSELLITEM` /
  // `CM_USERREPAIRITEM` / 双击使用发的都是 MakeIndex（`ClMain.pas:3711`、
  // `FState.pas:5452`），不是槽位号（背包一压缩，槽位号就指到别人身上了）。
  // 我们原来这一栏没下发 ⇒ 客户端**没法卖东西**（"背包槽 5"在两个面板之间会漂）。
  int32 make_index = 9;
  // 物品**类别**（`StdMode`，原版客户端挑声音用的就是它：`ItemClickSound`，
  // `SoundUtil.pas:293-310` —— 药 108 / 武器 111 / 盔甲 112 / 戒指 113 / 手镯 117 /
  // 项链 115 / 头盔 116 / 其他 118）。少了它客户端只能全体一个声。
  uint32 std_mode = 10;
}

// ---------- 服务端 → 客户端 ----------

// 全量背包（按槽位顺序；空槽为 index=0）。
message BagItems {
  repeated ItemStack items = 1;
}

message AddItem {
  uint32 slot = 1;
  ItemStack item = 2;
}

message RemoveItem {
  uint32 slot = 1;
}

message UpdateItem {
  uint32 slot = 1;
  ItemStack item = 2;
}

// 地面物品出现 / 消失（★ 与原版 SM_ITEMSHOW/SM_ITEMHIDE 对应）。
message GroundItemShow {
  uint64 ground_id = 1;
  Vec2 position = 2;
  ItemStack item = 3;
}

message GroundItemHide {
  uint64 ground_id = 1;
}

// 已穿戴（原版 SM_SENDUSEITEMS）。
message EquippedItems {
  repeated ItemStack items = 1;
}

message WeightChanged {
  uint32 weight = 1;
  uint32 max_weight = 2;
  uint32 wear_weight = 3;
  uint32 max_wear_weight = 4;
}

message GoldChanged {
  uint64 gold = 1;
}

message RepairCostNotice {
  uint32 slot = 1;
  uint32 cost = 2;
  bool special = 3; // 特修
}

// ---------- 客户端 → 服务端（一次性事务，走信封 request_id 判重）----------

message UseItem {
  uint32 slot = 1;
  uint32 client_tick = 2;
}

// 客户端 → 服务端：**移动/交换**背包里两格的物品（原版 `CM_MOVEITEM`：点起一格、
// 放到另一格；目标格有东西就是**交换**）。
//
// 槽位是**服务端背包数组**的下标：服务端背包保持无空洞（`takeBagItem` 取走后
// 前移补位）⇒ 客户端按顺序摆的格子与服务端下标一一对应，直接按下标走。
message MoveItem {
  uint32 from = 1;
  uint32 to = 2;
}

message DropItem {
  uint32 slot = 1;
  uint32 count = 2;
  uint32 client_tick = 3;
}

message PickupItem {
  uint64 ground_id = 1;
  uint32 client_tick = 2;
}

message EquipItem {
  // **背包槽位下标**（0-based；与 legacy 不同，客户端不提交目标装备槽；服务端按物品
  // StdMode 推导目标槽并重新校验）。
  uint32 slot = 1;
  uint32 client_tick = 2;
}

message UnequipItem {
  // 装备槽位下标（0-based；见 `internal/proto/contract.go` 的 Slot*）。
  uint32 equip_slot = 1;
  uint32 client_tick = 2;
}

message RepairItem {
  uint32 slot = 1;
  bool special = 2; // 特修（原版 @s_repair）
  uint32 client_tick = 3;
}

// 服务端 → 客户端：一条系统提示（原版 `sysMsg` 的对应物）。
//
// 挖肉的「肉被发现」「什么都没找到」、负重提醒……这些原本走 legacy 的
// `SM_SYSMESSAGE`，proto 玩家收不到 ⇒ 全都无声。客户端收到后推进聊天框。
message SystemNotice {
  string text = 1;
}
