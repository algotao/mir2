// MIR2 协议 · 0x04xx 场景 / 0x05xx 实体
//
// 对应 docs/protocol.md §7（实体标识）与 §8（移动与预测）。
// ★ `entity_id` 是 **uint64 全局唯一**，由服务端分配 —— 取代原版 16 位 `Series`
//   （装不下 ActorId，被迫"坐标优先定位目标"）。
// ★ 沿用 mir2go 的分段：玩家 < 1_000_000、怪物 ≥ 1_000_000、NPC ≥ 2_000_000。
syntax = "proto3";

package mir2;

import "common.proto";

option go_package = "github.com/algotao/mir2/server/protocol;protocol";

// ---------- 0x04xx 场景 ----------

// 实体的完整快照（进图初始快照 / 实体出现 用）。
message EntityState {
  uint64 entity_id = 1;
  uint32 kind = 2;              // 0=玩家 1=怪物 2=NPC
  string name = 3;
  Vec2 position = 4;
  Direction direction = 5;
  EntityFeature feature = 6;
  uint32 hp = 7;
  uint32 max_hp = 8;
  uint64 status_bits = 9;
  uint32 action = 10;
}

// 服务端 → 客户端：进世界（选角成功后的初始快照）。
message EnterWorld {
  uint64 self_entity_id = 1;
  uint32 map_id = 2;
  string map_name = 3;
  Vec2 position = 4;
  Direction direction = 5;
  repeated EntityState entities = 6;
  uint32 server_tick = 7;
  // 自己的外观 —— **不在 `entities` 里**：快照刻意不包含自己（自己由 `self_entity_id`
  // 与移动/心跳回显维护）。少了它客户端就画不出自己的精灵（连"自己长什么样"都不知道）。
  EntityFeature self_feature = 8;
  // 小地图图号（0 = 该图没有小地图）。
  //
  // 来源：服务端 `data/envir/MiniMap.txt` 的"地图号 → 小地图编号"（`s.cfg.miniMaps`）。
  // 客户端拿它当 **`mmap` 图库的下标（图号 - 1）** 去取整张地图的缩略图 ——
  // 与 legacy 的 `CM_WANTMINIMAP`/`SM_READMINIMAP_OK` 是同一份数据（`ClMain.pas:6045-6051`），
  // 只是新协议不再单开一问一答：进图/换图那条消息顺手带上。
  uint32 minimap_index = 9;
  // 自己的**角色名**（要画在自己头顶：原版 `FState.pas` 的头顶血条 + 名字）。
  // 快照里不含自己（见 `self_feature` 的说明），所以名字必须单独给 —— 否则客户端
  // 只能显示占位符（我们之前写的是 "[自己]"）。
  string self_name = 10;
  // 地图的**显示名**（`mapinfo.txt` 里那一段，如"比奇省"）—— 底部左下角那行的抬头，
  // 官方是服务端下发的地图描述（`ClMain.pas:5215-5224 ClientGetMapDescription`：
  // `g_sMapTitle + ' ' + X + ':' + Y`，`DrawScrn.pas:513`）。
  // ⚠️ 与 `map_name` 不是一回事：那个是**地图号**（本项目按名字索引地图，D-22）。
  string map_title = 11;
}

// 服务端 → 客户端：切换地图（重发新图快照）。
message ChangeMap {
  uint32 map_id = 1;
  string map_name = 2;
  Vec2 position = 3;
  repeated EntityState entities = 4;
  uint32 server_tick = 5;
  // 自己的外观，与 `EnterWorld.self_feature` 同义（换图后重发一次）。
  EntityFeature self_feature = 6;
  // 小地图图号 —— 换图了就是另一张缩略图，与 `EnterWorld.minimap_index` 同义。
  uint32 minimap_index = 7;
  // 地图显示名，与 `EnterWorld.map_title` 同义（换图要换抬头）。
  string map_title = 8;
}

// 大块地图数据 —— 独立分块传输（protocol.md §2：大二进制块单独分帧）。
message MapChunk {
  uint32 map_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  bytes data = 4;
}

// 日夜 / 光照（原版 SM_DAYCHANGING / SM_CHANGELIGHT）。
message TimeOfDay {
  uint32 hour = 1;
  uint32 minute = 2;
  bool dark = 3;
}

message MapDescription {
  uint32 map_id = 1;
  string description = 2;
}

// ---------- 0x05xx 实体 ----------

message EntityAppear {
  EntityState entity = 1;
}

enum DisappearReason {
  DISAPPEAR_REASON_UNSPECIFIED = 0;
  DISAPPEAR_LEFT_VIEW = 1;   // 离开视野
  DISAPPEAR_HIDE = 2;        // 隐身
  DISAPPEAR_DEAD = 3;        // 死亡移出（尸骨另见 Death）
  DISAPPEAR_LOGOUT = 4;
}

message EntityDisappear {
  uint64 entity_id = 1;
  DisappearReason reason = 2;
}

// 服务端权威移动广播（高频位置：可丢弃过期包，按 seq 丢弃）。
message EntityMove {
  uint64 entity_id = 1;
  Vec2 from = 2;
  Vec2 to = 3;
  Direction direction = 4;
  uint32 server_tick = 5;
  // 这一步是**跑**（原版是 `SM_RUN` 与 `SM_WALK` 两条消息；这里用一个标志位）。
  //
  // 客户端要它才能播对动画：走是 `ActWalk`（6 帧 × 90 ms）、跑是 `ActRun`
  //（6 帧 × 120 ms），两段的图号差 64（`Actor.pas:77-78`）。少了这个字段，
  // 跑起来只能放走的动画 —— 而且**连别人跑起来也看不出来**。
  bool run = 6;
}

// 动作切换（走/跑/攻击/受击/死亡/骑马…）。用动作 id + 时间戳，取代原版 70 个手写动画类。
//
// ⚠️ `action` 的**值域**见 docs/protocol.md §9.5（1..8 与 AttackAction 同值 / 51 受击 /
// 52 死亡）。它是本项目**自己定的**：原版那 70 个动画类没法照搬，也不该照搬。
message EntityAction {
  uint64 entity_id = 1;
  uint32 action = 2;
  uint32 server_tick = 3;
}

message EntityHealth {
  uint64 entity_id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
}

message EntityStatus {
  uint64 entity_id = 1;
  uint64 status_bits = 2;  // 隐身/中毒/石化…（约定见 decisions D-… 待定）
}

// 自身能力值（`Ability` 定义在 common.proto，scene 与 combat 共用）。
message AbilityUpdate {
  Ability ability = 1;
}

// 客户端 → 服务端：移动输入（★ 有且仅有一次生效：带 request_id 走信封）。
message MoveInput {
  Vec2 from = 1;
  Vec2 to = 2;
  Direction direction = 3;
  uint32 client_tick = 4;
  // 跑（原版 `CM_RUN`）：**一步 2 格**、节流比走短（`MinRun` vs `MinWalk`）。
  //
  // 原版客户端：按住右键（远距）或 Ctrl+左键 = 跑（`ClMain.pas:2200-2244 / 2344-2352`），
  // 其余左键 = 走；跑一步的位移见 `GetNextRunXY`（+2 格，`ClFunc.pas:370-382`）。
  //
  // ⚠️ 老客户端不填这个字段 ⇒ 默认 false = 走，行为与以前完全一致
  //（所以**不需要** bump `version.txt`：加带默认值的可选字段是兼容变更）。
  bool run = 5;
}

// 客户端 → 服务端：**割肉 / 挖肉**（原版 `CM_BUTCH`）。
//
// 操作方式（用户 2026-10-10 第 5 条 / 原版）：打死鸡/鹿/狼这类**动物**后，站到尸体
// 旁边一格，**按住 Alt 反复点左键**点在尸体上；有"皮革度/肉质量"，挖到 0 时
// 尸体变骷髅、身上的东西归挖肉的人（可能"什么都没找到"）。
//
// ⚠️ 与攻击是两条路：攻击带 `AttackInput`，割肉带这个 —— 目标必须是**死了的动物**。
message Butch {
  // 尸体（怪物）的实体号。
  uint64 target_id = 1;
  // 尸体所在格（服务端会核对：必须离自己 ≤ 2 格，且那格上就是它）。
  Vec2 position = 2;
  // 挖的时候要不要转身面对它（协议 `Direction`；0 = 未指定）。
  Direction direction = 3;
}

// 服务端 → 客户端：移动被拒（越界/超速），回权威位置校正。
message MoveRejected {
  Vec2 authoritative_position = 1;
  uint32 reason = 2; // 1=超速 2=越界 3=阻挡
}

message EntityFeatureChanged {
  uint64 entity_id = 1;
  EntityFeature feature = 2;
}
